name: Refresh US EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7,19 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'docs/**', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: epg-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test validation and channel matching
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate guide
        run: python scripts/update.py --days 7
      - name: Publish guide files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update US EPG schedules'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  pages:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
